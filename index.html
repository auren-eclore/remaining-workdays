<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="description" content="自动列出从明天到本月月底的工作日，每天安排 14:00–15:00 和 23:00–次日 00:00，支持复制与下载。">
  <title>本月剩余工作日</title>
  <style>
    :root { color-scheme: light; --bg: #f6f7f3; --ink: #223c35; --muted: #77817b; --green: #35705b; --soft: #eaf2e9; --line: #e5e9e2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #85b39a; outline-offset: 4px; }
    button:disabled { cursor: default; opacity: .45; }
    svg { display: block; flex-shrink: 0; }
    .shell { max-width: 1152px; margin: auto; padding: 0 40px; }
    .topbar { min-height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 650; letter-spacing: 1px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--ink); color: white; }
    .today { display: flex; align-items: center; gap: 9px; color: #6b7870; font-size: 13px; }
    .today-dot { width: 6px; height: 6px; border-radius: 50%; background: #6f9a77; }
    main { padding: 49px 0 28px; }
    .intro { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 35px; }
    .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 12px; letter-spacing: 1px; color: var(--green); margin-bottom: 12px; }
    h1 { font-size: clamp(27px, 4vw, 36px); letter-spacing: -1px; line-height: 1.35; font-weight: 650; margin: 0 0 13px; }
    .range { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .scope { white-space: nowrap; display: flex; gap: 7px; align-items: center; color: #637367; border: 1px solid #dce3d8; border-radius: 100px; padding: 9px 14px; font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.47fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 22px; }
    .list-card { padding: 27px; min-height: 525px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; font-weight: 650; margin: 0; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .copy { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--ink); color: white; border-radius: 9px; padding: 9px 12px; font-size: 12px; transition: background .15s, transform .15s; }
    .copy:hover:not(:disabled) { background: #386250; }
    .copy:active:not(:disabled) { transform: translateY(1px); }
    .download { display: grid; place-items: center; background: white; color: #65796b; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; }
    .download:hover:not(:disabled) { background: var(--soft); }
    .dates { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .date-row { display: flex; flex-direction: column; min-width: 0; border: 1px solid #e9ede6; border-radius: 10px; padding: 13px; gap: 11px; }
    .date-header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; width: 100%; gap: 10px; }
    .date-current { display: grid; gap: 5px; }
    .date-current .weekday { margin-left: 0; }
    .next-month { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8f9f7; }
    .next-month-caption { font-size: 10px; color: var(--muted); }
    .next-month-date { font-size: 12px; color: #748071; line-height: 1.5; }
    .next-month-weekday { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .next-month.is-workday { background: #d7edc7; border-color: #9fc68b; box-shadow: inset 3px 0 0 #4a7e36; }
    .next-month.is-workday .next-month-caption { color: #4a7040; }
    .next-month.is-workday .next-month-date, .next-month.is-workday .next-month-weekday { color: #244e1e; font-weight: 700; }
    .time-slots { display: grid; width: 100%; gap: 6px; }
    .time-slot { display: block; background: #f3f6f0; border-radius: 6px; padding: 7px 8px; color: #4b6b54; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .date-label { font-size: 13px; font-weight: 550; white-space: nowrap; }
    .weekday { margin-left: auto; font-size: 11px; color: #64806a; white-space: nowrap; }
    .list-bottom { margin: 23px 0 0; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #98a097; }
    .aside { display: grid; gap: 18px; }
    .summary { background: var(--ink); color: #f7fbf5; border-radius: 20px; padding: 24px 27px 22px; position: relative; overflow: hidden; }
    .summary::after { content: ""; position: absolute; width: 150px; height: 150px; border: 1px solid #436054; border-radius: 50%; right: -32px; top: 44px; box-shadow: 0 0 0 26px #ffffff03, 0 0 0 27px #43605455; pointer-events: none; }
    .summary-label { color: #c4d4c9; font-size: 12px; margin: 0; position: relative; z-index: 1; }
    .count-line { display: flex; align-items: baseline; gap: 12px; margin: 3px 0 0; position: relative; z-index: 1; }
    .count { font-size: 66px; line-height: 1.25; font-weight: 450; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
    .count-unit { font-size: 14px; color: #c4d4c9; }
    .calendar-card { padding: 23px; }
    .calendar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 23px; }
    .calendar-year { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .week-head, .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; gap: 5px; }
    .week-head { font-size: 11px; color: #99a095; margin-bottom: 11px; }
    .calendar-day { height: 34px; display: grid; place-items: center; border-radius: 8px; font-size: 12px; font-variant-numeric: tabular-nums; color: #8d978e; }
    .calendar-day.past { color: #bdc3bb; }
    .calendar-day.remaining { background: var(--soft); color: #376947; font-weight: 600; }
    .calendar-day.current { background: var(--ink); color: #fff; font-weight: 600; }
    .legend { display: flex; justify-content: center; gap: 19px; margin-top: 20px; font-size: 10px; color: #85907f; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 8px; height: 8px; border-radius: 3px; background: var(--soft); border: 1px solid #dfe9dc; }
    .swatch.dark { background: var(--ink); border-color: var(--ink); }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 26px 0 32px; color: #98a095; font-size: 11px; }
    .empty { min-height: 340px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center; color: var(--muted); }
    .empty svg { color: #7c9b80; margin-bottom: 6px; }
    .empty strong { font-size: 17px; color: var(--ink); font-weight: 550; }
    .empty p { font-size: 13px; margin: 0; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translate(-50%, 15px); background: #223c35; color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; box-shadow: 0 8px 30px #223c3520; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    [hidden] { display: none !important; }
    @media (min-width: 1000px) { .date-row:last-child:nth-child(odd) { grid-column: 1 / -1; } }
    @media (max-width: 900px) { .shell { padding: 0 25px; } .layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; } .list-card { padding: 23px; } .dates { grid-template-columns: 1fr; } .date-row { min-height: 46px; } }
    @media (max-width: 640px) { .shell { padding: 0 20px; } .topbar { min-height: 78px; } .today { font-size: 11px; gap: 6px; } .brand { font-size: 15px; gap: 8px; } .brand-mark { width: 30px; height: 30px; } main { padding-top: 32px; } .intro { align-items: flex-start; margin-bottom: 26px; gap: 14px; } h1 { font-size: 26px; letter-spacing: -.5px; } .eyebrow { font-size: 11px; } .range { font-size: 12px; } .scope { padding: 7px 9px; font-size: 10px; margin-top: 4px; } .scope svg { display: none; } .layout { grid-template-columns: 1fr; } .aside { grid-row: 1; grid-template-columns: 1fr; } .summary { display: flex; align-items: center; justify-content: space-between; padding: 17px 22px; } .count-line { margin: 0; gap: 9px; } .count { font-size: 45px; line-height: 1; letter-spacing: -2px; } .summary::after { top: -25px; right: 55px; } .calendar-card { display: none; } .list-card { min-height: 0; padding: 22px 19px; } .dates { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .date-row { padding: 12px 9px; gap: 7px; min-height: 54px; } .date-index { display: none; } .date-label { font-size: 12px; } .weekday { font-size: 10px; } footer { padding-top: 22px; font-size: 10px; } }
    @media (max-width: 350px) { .dates { grid-template-columns: 1fr; } .scope { display: none; } .today-dot { display: none; } }
    @media (max-width: 640px) { .time-slot { padding: 7px 5px; font-size: 11px; } .date-header { gap: 7px; } }
    @media (max-width: 640px) { .dates { grid-template-columns: 1fr; } .time-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 350px) { .time-slots { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-12 5 2.5 2.5L16 13"/></svg></span>工作日清单</div>
      <div class="today" title="北京时间（Asia/Shanghai）"><span class="today-dot" aria-hidden="true"></span><time id="today"></time></div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><div class="eyebrow"><span id="month-label"></span></div><h1 id="page-title">本月剩余工作日</h1><p class="range" id="range"></p></div>
        <span class="scope"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 10 4 4 8-8"/></svg>周一至周五</span>
      </section>
      <div class="layout">
        <section class="card list-card" aria-labelledby="list-title">
          <div class="card-head"><h2 id="list-title">每日安排</h2><div class="actions">
            <button class="download" id="download" type="button" title="下载每日安排" aria-label="下载每日安排"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg></button>
            <button class="copy" id="copy" type="button"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3"/></svg><span>复制安排</span></button>
          </div></div>
          <ol class="dates" id="dates"></ol>
          <div class="empty" id="empty" hidden><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5 2.5 2.5L16 13"/></svg><strong>本月已无剩余工作日</strong><p>下个月再来安排新的日程吧。</p></div>
          <p class="list-bottom" id="list-bottom"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>从明天开始，按日期排序</p>
        </section>
        <aside class="aside" aria-label="工作日概览">
          <section class="summary" aria-label="剩余工作日总数"><p class="summary-label">本月还有</p><p class="count-line"><span class="count" id="count">—</span><span class="count-unit">个工作日</span></p></section>
          <section class="card calendar-card" aria-labelledby="calendar-title"><div class="calendar-head"><h2 id="calendar-title"></h2><span class="calendar-year" id="calendar-year"></span></div><div class="week-head" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar" id="calendar" role="list" aria-label="本月日历"></div><div class="legend" aria-hidden="true"><span><i class="swatch dark"></i>今天</span><span><i class="swatch"></i>剩余工作日</span></div></section>
        </aside>
      </div>
    </main>
    <footer><span>按北京时间自动更新</span><span id="footer-month"></span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="text-align:center;padding:24px">请启用 JavaScript 以查看工作日清单。</p></noscript>
  <script id="workday-core">
    (() => {
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const pad = n => String(n).padStart(2, '0');
      const timeSlots = Object.freeze(['14:00–15:00', '23:00–次日 00:00']);
      function nextMonthDate(iso) {
        const [year, month, day] = iso.split('-').map(Number);
        const date = new Date(Date.UTC(year, month, day));
        if (date.getUTCDate() !== day) return null;
        const nextYear = date.getUTCFullYear();
        const nextMonth = date.getUTCMonth() + 1;
        const weekday = date.getUTCDay();
        return { year: nextYear, month: nextMonth, day, iso: `${nextYear}-${pad(nextMonth)}-${pad(day)}`, weekday, weekdayLabel: weekdays[weekday], isWeekday: weekday >= 1 && weekday <= 5 };
      }
      function formatSchedule(workdays) {
        return workdays.map(item => `${item.iso} ${item.weekdayLabel}（下月同日：${item.nextMonth ? `${item.nextMonth.iso} ${item.nextMonth.weekdayLabel}` : '无对应日期'}）\n  ${timeSlots.join('\n  ')}`).join('\n\n');
      }
      function todayISO(now = new Date()) {
        const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(now);
        const get = name => parts.find(part => part.type === name).value;
        return `${get('year')}-${get('month')}-${get('day')}`;
      }
      function buildMonth(iso) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) throw new RangeError('日期格式无效');
        const [year, month, day] = iso.split('-').map(Number);
        const base = new Date(Date.UTC(year, month - 1, day));
        if (base.getUTCFullYear() !== year || base.getUTCMonth() + 1 !== month || base.getUTCDate() !== day) throw new RangeError('日期无效');
        const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
        const days = Array.from({ length: lastDay }, (_, index) => {
          const number = index + 1;
          const weekday = new Date(Date.UTC(year, month - 1, number)).getUTCDay();
          const iso = `${year}-${pad(month)}-${pad(number)}`;
          return { day: number, weekday, weekdayLabel: weekdays[weekday], iso, nextMonth: nextMonthDate(iso), remaining: number > day && weekday > 0 && weekday < 6 };
        });
        return { iso, year, month, day, lastDay, weekdayLabel: weekdays[base.getUTCDay()], days, workdays: days.filter(item => item.remaining) };
      }
      globalThis.Workdays = Object.freeze({ todayISO, buildMonth, timeSlots, formatSchedule, nextMonthDate });
    })();
  </script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let current;
      let toastTimer;
      function render() {
        const iso = Workdays.todayISO();
        if (current?.iso === iso) return;
        current = Workdays.buildMonth(iso);
        const { year, month, day, lastDay, weekdayLabel, days, workdays } = current;
        $('today').dateTime = iso;
        $('today').textContent = `今天 ${month} 月 ${day} 日 · ${weekdayLabel}`;
        $('month-label').textContent = `${year} 年 / ${String(month).padStart(2, '0')} 月`;
        $('range').textContent = day === lastDay ? `${month} 月已到最后一天` : `${month} 月 ${day + 1} 日 — ${month} 月 ${lastDay} 日`;
        $('count').textContent = workdays.length;
        $('calendar-title').textContent = `${month} 月`;
        $('calendar-year').textContent = year;
        $('footer-month').textContent = `${year}.${String(month).padStart(2, '0')}`;
        $('dates').replaceChildren(...workdays.map(item => {
          const li = document.createElement('li');
          li.className = 'date-row';
          const date = document.createElement('time'); date.className = 'date-label'; date.dateTime = item.iso; date.textContent = `${month} 月 ${item.day} 日`;
          const weekday = document.createElement('span'); weekday.className = 'weekday'; weekday.textContent = item.weekdayLabel;
          const currentDate = document.createElement('div'); currentDate.className = 'date-current'; currentDate.append(date, weekday);
          const corresponding = document.createElement('div'); corresponding.className = `next-month${item.nextMonth?.isWeekday ? ' is-workday' : ''}`;
          const caption = document.createElement('span'); caption.className = 'next-month-caption'; caption.textContent = '下月同日';
          const nextDate = document.createElement(item.nextMonth ? 'time' : 'span'); nextDate.className = 'next-month-date';
          if (item.nextMonth) {
            nextDate.dateTime = item.nextMonth.iso;
            nextDate.textContent = `${item.nextMonth.year !== year ? `${item.nextMonth.year} 年 ` : ''}${item.nextMonth.month} 月 ${item.nextMonth.day} 日`;
          } else { nextDate.textContent = '无对应日期'; }
          corresponding.append(caption, nextDate);
          if (item.nextMonth) {
            const nextWeekday = document.createElement('span'); nextWeekday.className = 'next-month-weekday'; nextWeekday.textContent = item.nextMonth.weekdayLabel; corresponding.append(nextWeekday);
          }
          const header = document.createElement('div'); header.className = 'date-header'; header.append(currentDate, corresponding);
          const slots = document.createElement('div'); slots.className = 'time-slots';
          for (const text of Workdays.timeSlots) {
            const slot = document.createElement('span'); slot.className = 'time-slot'; slot.textContent = text; slots.append(slot);
          }
          li.append(header, slots);
          return li;
        }));
        $('empty').hidden = workdays.length > 0;
        $('dates').hidden = workdays.length === 0;
        $('list-bottom').hidden = workdays.length === 0;
        $('copy').disabled = workdays.length === 0;
        $('download').disabled = workdays.length === 0;
        const cells = [];
        const offset = (days[0].weekday + 6) % 7;
        for (let i = 0; i < offset; i++) { const blank = document.createElement('span'); blank.setAttribute('aria-hidden', 'true'); cells.push(blank); }
        for (const item of days) {
          const cell = document.createElement('time');
          cell.className = `calendar-day${item.day < day ? ' past' : ''}${item.remaining ? ' remaining' : ''}${item.day === day ? ' current' : ''}`;
          cell.dateTime = item.iso; cell.textContent = item.day; cell.setAttribute('role', 'listitem');
          cell.setAttribute('aria-label', `${month}月${item.day}日，${item.weekdayLabel}${item.day === day ? '，今天' : item.remaining ? '，剩余工作日' : ''}`);
          if (item.day === day) cell.setAttribute('aria-current', 'date');
          cells.push(cell);
        }
        $('calendar').replaceChildren(...cells);
      }
      function textList() { render(); return Workdays.formatSchedule(current.workdays); }
      function toast(message) { clearTimeout(toastTimer); $('toast').textContent = message; $('toast').classList.add('visible'); toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 2800); }
      $('copy').addEventListener('click', async () => {
        const text = textList();
        if (!text) return;
        try { await navigator.clipboard.writeText(text); }
        catch {
          const input = document.createElement('textarea'); input.value = text; input.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.append(input); input.focus(); input.select();
          let success = false;
          try { success = document.execCommand('copy'); } catch {} finally { input.remove(); $('copy').focus(); }
          if (!success) { toast('复制失败，请使用下载按钮保存清单'); return; }
        }
        toast(`已复制 ${current.workdays.length} 天的时间安排`);
      });
      $('download').addEventListener('click', () => {
        const text = textList();
        if (!text) return;
        const blob = new Blob(['\ufeff', text, '\n'], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a'); link.href = url; link.download = `工作日清单_${current.iso}.txt`; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('每日安排已下载');
      });
      render();
      setInterval(render, 15000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
      window.addEventListener('focus', render);
    })();
  </script>
</body>
</html>
